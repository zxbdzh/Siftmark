name: Release Chromium extension

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (defaults to package.json, for example 0.1.2)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: siftmark-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.package.outputs.artifact }}
      checksum_name: ${{ steps.package.outputs.checksum_name }}
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      zip_name: ${{ steps.package.outputs.zip_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source and version
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          requested_version="${INPUT_VERSION#v}"

          if [ "$EVENT_NAME" = 'push' ]; then
            requested_version="${REF_NAME#v}"
          elif [ -z "$requested_version" ]; then
            requested_version="$package_version"
          fi

          if [[ ! "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $requested_version (expected x.y.z)" >&2
            exit 1
          fi

          if [ "$requested_version" != "$package_version" ]; then
            echo "Release version $requested_version does not match package.json version $package_version" >&2
            exit 1
          fi

          release_commit="$(git rev-parse HEAD)"
          default_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git rev-parse --verify --quiet "${default_ref}^{commit}" >/dev/null; then
            echo "Default branch ref is unavailable: $default_ref" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$EVENT_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "Manual releases must run from the $DEFAULT_BRANCH branch" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            default_commit="$(git rev-parse "${default_ref}^{commit}")"
            if [ "$release_commit" != "$default_commit" ]; then
              echo "Manual releases must run from the current $DEFAULT_BRANCH HEAD" >&2
              exit 1
            fi
          elif ! git merge-base --is-ancestor "$release_commit" "$default_ref"; then
            echo "Release tag must point to a commit in $DEFAULT_BRANCH history" >&2
            exit 1
          fi

          release_tag="v$package_version"
          if git rev-parse --verify --quiet "refs/tags/${release_tag}^{commit}" >/dev/null; then
            tagged_commit="$(git rev-parse "refs/tags/${release_tag}^{commit}")"
            if [ "$tagged_commit" != "$release_commit" ]; then
              echo "Tag $release_tag points to another commit; bump package.json before publishing a new release" >&2
              exit 1
            fi
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run type checks
        run: pnpm typecheck

      - name: Run lint checks
        run: pnpm lint

      - name: Run unit and integration tests
        run: pnpm test --coverage

      - name: Package release artifacts
        id: package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          pnpm zip

          source_path=".output/siftmark-${VERSION}-chrome.zip"
          zip_name="siftmark-${VERSION}-chromium.zip"
          checksum_name="${zip_name}.sha256"
          target_path="release/${zip_name}"

          if [ ! -f "$source_path" ]; then
            echo "WXT artifact not found: $source_path" >&2
            exit 1
          fi

          manifest_version="$(node -p "JSON.parse(require('fs').readFileSync('.output/chrome-mv3/manifest.json', 'utf8')).version")"
          if [ "$manifest_version" != "$VERSION" ]; then
            echo "Extension version $manifest_version does not match release version $VERSION" >&2
            exit 1
          fi

          mkdir -p release
          cp "$source_path" "$target_path"
          (
            cd release
            sha256sum "$zip_name" > "$checksum_name"
          )

          echo "artifact=siftmark-${VERSION}-chromium" >> "$GITHUB_OUTPUT"
          echo "zip=$target_path" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "checksum=${target_path}.sha256" >> "$GITHUB_OUTPUT"
          echo "checksum_name=$checksum_name" >> "$GITHUB_OUTPUT"

      - name: Test packaged extension end to end
        env:
          SIFTMARK_E2E_REUSE_BUILD: '1'
        run: pnpm test:e2e

      - name: Upload verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify.outputs.commit }}

      - name: Revalidate existing release tag
        env:
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
            tagged_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [ "$tagged_commit" != "$RELEASE_COMMIT" ]; then
              echo "Tag $RELEASE_TAG changed after verification" >&2
              exit 1
            fi
          fi

      - name: Download verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.verify.outputs.artifact }}
          path: release

      - name: Verify downloaded checksum
        env:
          CHECKSUM_NAME: ${{ needs.verify.outputs.checksum_name }}
        working-directory: release
        run: sha256sum --check "$CHECKSUM_NAME"

      - name: Create GitHub Release
        env:
          CHECKSUM_PATH: release/${{ needs.verify.outputs.checksum_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          ZIP_PATH: release/${{ needs.verify.outputs.zip_name }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ZIP_PATH" "$CHECKSUM_PATH" \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "$ZIP_PATH" "$CHECKSUM_PATH" \
              --target "$RELEASE_COMMIT" \
              --title "Siftmark v${RELEASE_VERSION}" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
